name: 'Repo checks'

on:
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run repository checks
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 .github/scripts/repo_checks.py --base "origin/$BASE_REF" --branch "$HEAD_REF"
